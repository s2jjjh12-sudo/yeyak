<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D5A54">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="예약현황">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<title>예약현황</title>
<style>
:root {
  --bg: #F2F4F1; --surface: #FFFFFF; --sunk: #E9ECE7; --line: #CDD3CB; --line-strong: #9EA79B;
  --fg: #111613; --muted: #4A524D; --accent: #17504A; --accent-ink: #FFFFFF; --accent-soft: #D8EAE6;
  --warn: #7A4300; --warn-soft: #FCE8C8; --bad: #9C2414; --bad-soft: #F8DAD2; --good: #1F5A20; --good-soft: #D7EDD3;
  --hold: #43496A; --hold-soft: #E1E3EF;
  --font: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --r: 14px;
  color-scheme: light;
}
html { font-size: 18px; -webkit-text-size-adjust: 100%; }
html.big { font-size: 21px; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 1rem; line-height: 1.55; word-break: keep-all; overflow-wrap: anywhere; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { max-width: 640px; margin: 0 auto; padding: 16px max(14px, env(safe-area-inset-right, 0px)) calc(110px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); display: grid; gap: 16px; }
.wrap > * { min-width: 0; }
h1 { font-size: 1.45rem; line-height: 1.25; margin: 0; }
h2 { font-size: 1.2rem; line-height: 1.3; margin: 0; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* 머리 */
header.top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; }
.who { font-size: .95rem; color: var(--muted); margin-top: 2px; }
.stamp { font-size: .82rem; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
.stamp.loading { color: var(--warn); }
.tools { display: grid; gap: 8px; justify-items: end; }
.btn { appearance: none; border: 2px solid var(--line-strong); background: var(--surface); border-radius: 12px; min-height: 52px; padding: 8px 16px; font-weight: 700; font-size: 1rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: var(--fg); transition: transform .12s ease, background-color .12s ease; }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.pay { border-color: var(--good); color: var(--good); }
.btn.pay.solid { background: var(--good); color: #fff; }
.btn.small { min-height: 44px; padding: 4px 12px; font-size: .9rem; }
.btn svg { width: 1.15em; height: 1.15em; flex: none; }
.btn.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.seg { display: inline-flex; border: 2px solid var(--line-strong); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); min-height: 36px; padding: 0 12px; font-weight: 700; font-size: .85rem; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.notice { border-radius: 12px; padding: 12px 14px; font-size: .95rem; background: var(--accent-soft); }
.notice.bad { background: var(--bad-soft); color: var(--bad); font-weight: 600; }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.notice .btn { margin-top: 10px; }
.hint { background: var(--surface); border: 2px solid var(--accent); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; }
.hint b { font-size: 1.05rem; }
.hint .hname { font-weight: 800; margin-bottom: 4px; }
.hint ol { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
.hint .row { display: flex; gap: 8px; flex-wrap: wrap; }
.key { display: inline-block; border: 1.5px solid var(--line-strong); border-radius: 6px; padding: 0 6px; background: var(--sunk); font-weight: 700; }

/* 날짜 묶음 */
.day { display: grid; gap: 10px; }
.day-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 0 2px; }
.day-h h2 .d { font-weight: 600; color: var(--muted); font-size: 1rem; margin-left: 6px; }
.day-h .sum { font-weight: 800; color: var(--accent); font-size: 1.05rem; }
.day.today .day-h h2 { color: var(--accent); }
.empty-line { color: var(--muted); background: var(--surface); border: 1px dashed var(--line-strong); border-radius: var(--r); padding: 14px; }
.vac { font-size: .9rem; color: var(--muted); padding: 0 2px; }

/* 예약 카드 */
.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; }
.day.today .card { border-color: var(--accent); }
.card .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card .room { font-size: 1.15rem; font-weight: 800; }
.chip { display: inline-flex; align-items: center; border-radius: 999px; padding: 1px 10px; font-size: .82rem; font-weight: 700; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip.stay { background: var(--good-soft); color: var(--good); }
.chip.block { background: var(--hold-soft); color: var(--hold); }
.chip.cancel { background: var(--bad-soft); color: var(--bad); }
.chip.ask, .chip.other { background: var(--warn-soft); color: var(--warn); }
.card .nm { font-size: 1.15rem; font-weight: 700; }
.card .meta { color: var(--muted); font-size: .92rem; display: flex; flex-wrap: wrap; gap: 2px 12px; }
.card .memo { background: var(--sunk); border-radius: 10px; padding: 8px 12px; font-size: .95rem; }
.card .memo b { color: var(--muted); margin-right: 6px; }
.card .done { background: var(--good-soft); color: var(--good); border-radius: 10px; padding: 6px 12px; font-size: .92rem; font-weight: 700; }
.card .done.cx { background: var(--sunk); color: var(--muted); text-decoration: line-through; font-weight: 500; }
.card .nt1 { border-left: 4px solid var(--accent); padding: 2px 0 2px 10px; font-size: .92rem; color: var(--muted); }
.card .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 2px; }
.card .acts .btn { white-space: nowrap; padding: 8px 6px; font-size: .95rem; }
#hint { margin-bottom: 8px; }
.card .acts.one { grid-template-columns: 1fr; }
.tel { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-weight: 800; text-decoration: none; border: 2px solid var(--accent); border-radius: 10px; padding: 4px 12px; min-height: 44px; font-variant-numeric: tabular-nums; }
.tel svg { width: 1em; height: 1em; }

/* 2주 목록 */
details.dd { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); }
details.dd + details.dd { margin-top: 8px; }
details.dd > summary { list-style: none; cursor: pointer; padding: 12px 14px; min-height: 56px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; }
details.dd > summary::-webkit-details-marker { display: none; }
details.dd > summary .dt { font-weight: 800; font-variant-numeric: tabular-nums; }
details.dd > summary .dt .sun { color: var(--bad); }
details.dd > summary .dt .sat { color: var(--hold); }
details.dd > summary .cnt { color: var(--muted); font-size: .92rem; }
details.dd > summary .cnt b { color: var(--accent); }
details.dd > summary .arr { font-size: 1.3rem; color: var(--muted); transition: transform .15s; }
details.dd[open] > summary .arr { transform: rotate(90deg); }
details.dd .inner { padding: 0 10px 12px; display: grid; gap: 10px; }

.panel { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; }
.item { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 2px; }
.item:first-of-type { border-top: 0; padding-top: 0; }
.item .h { font-size: .85rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 0 10px; }
.item .h b { color: var(--fg); }
.item .t { white-space: pre-wrap; }
.item .amt { font-weight: 800; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.item.cx .amt, .item.cx .t { text-decoration: line-through; color: var(--muted); }
.item .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.tot { display: flex; flex-wrap: wrap; gap: 6px 14px; background: var(--good-soft); color: var(--good); border-radius: 10px; padding: 10px 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.skel { height: 120px; border-radius: var(--r); background: var(--sunk); }

/* 아래 고정 버튼 */
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(242, 244, 241, .96); border-top: 1px solid var(--line); padding: 10px max(14px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); z-index: 10; }
.bar .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bar .in.one { grid-template-columns: 1fr; }
.bar .btn { min-height: 60px; font-size: 1rem; white-space: nowrap; padding: 8px 10px; }

/* 입력 창 */
.sheet { position: fixed; inset: 0; z-index: 20; background: rgba(17, 22, 19, .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet .box { background: var(--surface); width: 100%; max-width: 640px; max-height: 94vh; max-height: 94dvh; overflow: auto; border-radius: 20px 20px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; animation: up .2s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet .hd { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sheet .ctx { background: var(--sunk); border-radius: 12px; padding: 10px 14px; font-weight: 700; }
.sheet .ctx small { display: block; font-weight: 500; color: var(--muted); font-size: .88rem; }
.f { display: grid; gap: 6px; font-weight: 700; }
.f > span.l { font-size: .95rem; color: var(--muted); }
.f input, .f select, .f textarea { width: 100%; border: 2px solid var(--line-strong); border-radius: 12px; padding: 12px 14px; background: var(--surface); font-size: 1.05rem; font-weight: 500; min-height: 56px; }
.f textarea { min-height: 130px; resize: vertical; line-height: 1.5; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { border: 2px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 6px 14px; min-height: 44px; font-weight: 700; cursor: pointer; }
.amtbox { display: flex; align-items: center; border: 3px solid var(--good); border-radius: 14px; padding: 0 14px; background: var(--surface); }
.amtbox input { border: 0; outline: 0; flex: 1; min-width: 0; font-size: 1.7rem; font-weight: 800; padding: 10px 0; text-align: right; font-variant-numeric: tabular-nums; background: transparent; }
.amtbox span { font-size: 1.3rem; font-weight: 800; margin-left: 6px; }
.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.quick button { min-height: 52px; border: 2px solid var(--line-strong); background: var(--surface); border-radius: 12px; font-weight: 800; cursor: pointer; }
.methods { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.methods button { min-height: 64px; border: 3px solid var(--line-strong); background: var(--surface); border-radius: 14px; font-weight: 800; font-size: 1rem; cursor: pointer; white-space: nowrap; padding: 0 4px; }
.methods button[aria-pressed="true"] { border-color: var(--good); background: var(--good); color: #fff; }
.err { color: var(--bad); font-weight: 700; }
.confirm { text-align: center; display: grid; gap: 6px; padding: 10px 0; }
.confirm .big { font-size: 2rem; font-weight: 900; font-variant-numeric: tabular-nums; }
.confirm .m { font-size: 1.3rem; font-weight: 800; color: var(--good); }
.okmark { text-align: center; display: grid; gap: 10px; justify-items: center; padding: 20px 0; font-size: 1.2rem; font-weight: 800; color: var(--good); }
.okmark svg { width: 72px; height: 72px; }
.okmark circle { fill: var(--good-soft); }
.okmark path { fill: none; stroke: var(--good); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20; stroke-dashoffset: 20; animation: draw .45s .05s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.foot { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.foot .btn { min-height: 60px; font-size: 1.05rem; }
@media (max-width: 360px) { .quick { grid-template-columns: repeat(2, 1fr); } .two { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .okmark path { stroke-dashoffset: 0; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="title">예약현황</h1>
      <p class="who" id="who" hidden></p>
      <p class="stamp" id="stamp" aria-live="polite"></p>
    </div>
    <div class="tools">
      <button class="btn" type="button" id="refreshBtn" aria-label="새로고침"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>새로고침</button>
      <div class="seg" role="group" aria-label="글씨 크기"><button type="button" data-size="n" aria-pressed="true">글씨 보통</button><button type="button" data-size="b" aria-pressed="false">크게</button></div>
    </div>
  </header>

  <div class="notice bad" id="noLink" hidden>본사에서 받은 링크로 열어 주세요. 링크가 없거나 바뀌었다면 본사에 새 링크를 받아 주세요.</div>
  <div class="notice bad" id="err" hidden></div>
  <div class="notice warn" id="kakao" hidden>카카오톡 안에서 열려 있어요. 아래 버튼을 누르면 크롬·사파리로 열려서 더 잘 보여요.<br><button class="btn primary" type="button" id="openOut">인터넷 앱으로 열기</button></div>


  <div id="main">
    <div id="days2"><div class="skel"></div></div>
    <section class="hint" id="hint" hidden aria-labelledby="hintT">
      <b id="hintT">휴대폰 바탕화면에 아이콘 만들기</b>
      <p>한 번만 해 두면 다음부터 아이콘만 누르면 열려요.</p>
      <div id="hintBody" hidden><p class="hname" id="hintName"></p><ol id="hintSteps"></ol></div>
      <div class="row"><button class="btn small primary" type="button" id="hintOpen">방법 보기</button><button class="btn small" type="button" id="hintOther" hidden>다른 휴대폰 방법</button><button class="btn small" type="button" id="hintClose">닫기</button></div>
    </section>
    <section class="day" id="later" hidden aria-labelledby="hLater">
      <div class="day-h"><h2 id="hLater">앞으로 2주</h2><span class="vac">날짜를 누르면 펼쳐져요</span></div>
      <div id="laterList"></div>
    </section>
    <section class="panel" id="payPanel" hidden aria-labelledby="hPay">
      <h2 id="hPay">현장결제 기록</h2>
      <div id="payTot"></div>
      <div id="payList"></div>
    </section>
    <section class="panel" aria-labelledby="hNotes">
      <h2 id="hNotes">최근 특이사항</h2>
      <div id="noteList"></div>
    </section>
  </div>
</div>

<nav class="bar" id="bar" hidden aria-label="적기">
  <div class="in" id="barIn">
    <button class="btn primary" type="button" id="barNote">특이사항 적기</button>
    <button class="btn pay solid" type="button" id="barPay" hidden>현장결제 적기</button>
  </div>
</nav>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="shT">
  <div class="box" id="shBox"></div>
</div>

<script>
(function () {
  var API_URL = 'https://script.google.com/macros/s/AKfycbzrJt_j8NJ237LcgDZZ3HbGdGagV4XrHlddHKm38kIxAvmrCmuwTrjZ0E-9_DFmwtme/exec';
  var AUTO_MS = 90 * 1000;
  var CANCEL_MIN = 30;
  var NOTE_CHIPS = ['얼리체크인 요청', '늦은 퇴실 요청', '비품 부족', '고장·파손', '청소 필요', '손님 요청', '분실물'];
  var ROOM_ANY = '공용·기타';

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
  function won(n) { return Number(n || 0).toLocaleString('ko-KR') + '원'; }
  function md(ymd) { var p = String(ymd).split('-'); return (+p[1]) + '월 ' + (+p[2]) + '일'; }
  function mdShort(ymd) { var p = String(ymd).split('-'); return (+p[1]) + '/' + (+p[2]); }
  function telHref(p) { return 'tel:' + String(p).replace(/[^0-9+]/g, ''); }
  function kstNowMs() { return Date.now(); }
  function kstMs(s) { var t = Date.parse(String(s).replace(' ', 'T') + '+09:00'); return isNaN(t) ? 0 : t; }

  // 링크 코드: 주소의 ?b= → 없으면 이 휴대폰에 기억해 둔 코드
  var qs = new URLSearchParams(location.search);
  var CODE = (qs.get('b') || '').replace(/[^a-z0-9-]/gi, '').toLowerCase().slice(0, 40);
  if (CODE) store('yeyak_code', CODE);
  else { CODE = store('yeyak_code') || ''; if (CODE && history.replaceState) history.replaceState(null, '', location.pathname + '?b=' + CODE); }

  var S = { data: null, busy: false, lastAt: 0, open: {} };

  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
      .then(function (r) { if (!r.ok) throw new Error('서버에 연결하지 못했어요. 잠시 후 다시 해 주세요.'); return r.json(); })
      .then(function (j) { if (!j || !j.ok) throw new Error((j && j.error) || '서버 오류가 났어요.'); return j.data; })
      ['catch'](function (e) { throw new Error(e && e.message && !/fetch|network|Load failed/i.test(e.message) ? e.message : '인터넷 연결을 확인하고 다시 해 주세요.'); });
  }

  // ---------- 글씨 크기
  function setSize(s) {
    document.documentElement.classList.toggle('big', s === 'b');
    [].forEach.call(document.querySelectorAll('[data-size]'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-size') === s)); });
    store('yeyak_size', s);
  }
  setSize(store('yeyak_size') === 'b' ? 'b' : 'n');
  document.addEventListener('click', function (ev) { var b = ev.target.closest && ev.target.closest('[data-size]'); if (b) setSize(b.getAttribute('data-size')); });

  // ---------- 카카오톡 안 / 홈 화면 안내
  var UA = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/i.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isKakao = /KAKAOTALK/i.test(UA);
  var isSamsung = /SamsungBrowser/i.test(UA);
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  if (isKakao) {
    $('kakao').hidden = false;
    $('openOut').addEventListener('click', function () { location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href); });
  }

  function saveNote(btn) {
    readCtx();
    var text = ($('sText').value || '').trim();
    if (!text) { setErr('내용을 적어 주세요.'); $('sText').focus(); return; }
    if (SH.writer) store('yeyak_writer', SH.writer);
    btn.disabled = true; btn.textContent = '저장 중…'; setErr('');
    call('addNote', CODE, { date: SH.date, room: SH.room, text: text, writer: SH.writer }).then(function (notes) {
      S.data.notes = notes; render(); SH.step = 'ok'; drawSheet();
    })['catch'](function (e) { btn.disabled = false; btn.textContent = '저장'; setErr(e.message + ' 다시 눌러 주세요.'); });
  }
  function savePay(btn) {
    if (SH.writer) store('yeyak_writer', SH.writer);
    btn.disabled = true; btn.textContent = '저장 중…'; setErr('');
    call('addPay', CODE, { date: SH.date, room: SH.room, amount: SH.amount, method: SH.method, memo: SH.memo, writer: SH.writer }).then(function (pays) {
      S.data.pays = pays; render(); SH.step = 'ok'; drawSheet();
    })['catch'](function (e) { btn.disabled = false; btn.textContent = '네, 저장'; setErr(e.message); });
  }
  function cancelPay(id, btn) {
    var p = (S.data.pays || []).filter(function (x) { return x.id === id; })[0]; if (!p) return;
    if (!confirm(won(p.amount) + ' ' + p.method + ' 기록을 취소할까요?')) return;
    btn.disabled = true; btn.textContent = '취소하는 중…';
    call('cancelPay', CODE, id).then(function (pays) { S.data.pays = pays; render(); })
      ['catch'](function (e) { alert(e.message); btn.disabled = false; btn.textContent = '잘못 적었어요 · 취소'; });
  }

  // ---------- 시작
  document.addEventListener('toggle', function (ev) { var d = ev.target; if (d.classList && d.classList.contains('dd')) S.open[d.getAttribute('data-date')] = d.open; }, true);
  $('refreshBtn').addEventListener('click', function () { load(false); });
  $('barNote').addEventListener('click', function () { openSheet('note'); });
  $('barPay').addEventListener('click', function () { openSheet('pay'); });
  setInterval(function () { if (!document.hidden && !SH) load(true); }, AUTO_MS);
  setInterval(stamp, 30000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && !SH && S.lastAt && Date.now() - S.lastAt > AUTO_MS) load(true); });

  if (!CODE) { $('noLink').hidden = false; $('main').hidden = true; $('refreshBtn').hidden = true; }
  else load(false);
})();
</script>
</body>
</html>
